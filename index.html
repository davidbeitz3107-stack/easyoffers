<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>EasyOffer v2.2</title>

<style>
:root{
  --bg:#f4f4f5;
  --panel:#fff;
  --text:#111;
  --muted:#737373;
  --line:#e4e4e7;
  --dark:#111;
  --soft:#f8f8f8;
  --green:#16803c;
  --orange:#a15c00;
  --red:#b42318;
  --blue:#175cd3;
  --shadow:0 8px 30px rgba(0,0,0,.06);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.sidebar{
  width:240px;
  background:#111;
  color:#fff;
  padding:22px 14px;
  position:fixed;
  inset:0 auto 0 0;
  z-index:10;
}

.brand{
  font-size:23px;
  font-weight:800;
  padding:5px 10px 28px;
}

.brand span{color:#999}

.nav button{
  width:100%;
  background:none;
  border:0;
  color:#aaa;
  text-align:left;
  padding:12px;
  border-radius:9px;
  margin:2px 0;
}

.nav button:hover,
.nav button.active{
  background:#292929;
  color:#fff;
}

.main{
  margin-left:240px;
  padding:28px;
  max-width:1600px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:24px;
}

.top h1{
  margin:0;
  font-size:28px;
}

.sub{
  color:var(--muted);
  margin-top:5px;
}

.muted{
  color:var(--muted);
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card,
.panel,
.feature{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
}

.card{
  padding:19px;
}

.card .label{
  color:var(--muted);
  font-size:13px;
}

.card .value{
  font-size:27px;
  font-weight:800;
  margin-top:8px;
}

.panel{
  padding:20px;
  margin-top:18px;
}

.panel h2{
  font-size:17px;
  margin:0 0 16px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#555;
  margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  background:#fff;
  outline:none;
}

.field input:focus,
.field textarea:focus,
.field select:focus,
.itemrow input:focus,
.itemrow select:focus{
  border-color:#111;
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.table-wrap{
  width:100%;
  overflow-x:auto;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  text-align:left;
  padding:11px 8px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

.table th{
  color:var(--muted);
  font-size:12px;
  white-space:nowrap;
}

.table td{
  vertical-align:middle;
}

.table-actions{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  padding:10px 15px;
  border-radius:9px;
  font-weight:650;
}

.btn:hover{
  background:#f5f5f5;
}

.btn.dark{
  background:#111;
  color:#fff;
  border-color:#111;
}

.btn.dark:hover{
  background:#292929;
}

.btn.small{
  padding:7px 10px;
  font-size:13px;
}

.btn.danger{
  color:var(--red);
  border-color:#f0c9c5;
}

.btn.danger:hover{
  background:#fff5f4;
}

.btn.green{
  color:var(--green);
  border-color:#bce5c9;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  background:#eee;
  white-space:nowrap;
}

.badge.green{
  background:#e8f6ed;
  color:var(--green);
}

.badge.orange{
  background:#fff2df;
  color:var(--orange);
}

.badge.red{
  background:#fdecea;
  color:var(--red);
}

.badge.blue{
  background:#eaf1ff;
  color:var(--blue);
}

.bar{
  height:12px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  background:#111;
}

.kpi{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.mini{
  padding:14px;
  border:1px solid var(--line);
  border-radius:10px;
}

.mini b{
  display:block;
  font-size:22px;
  margin-top:5px;
}

.chart{
  height:250px;
  display:flex;
  align-items:flex-end;
  gap:12px;
  padding:15px 5px 25px;
  border-bottom:1px solid var(--line);
}

.chartcol{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
  min-width:0;
}

.chartcol i{
  width:70%;
  max-width:50px;
  background:#111;
  border-radius:5px 5px 0 0;
  min-height:3px;
}

.chartcol span{
  font-size:11px;
  color:var(--muted);
}

.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

.cal-dayname{
  padding:10px;
  background:#f8f8f8;
  font-size:12px;
  font-weight:700;
  color:#666;
}

.day{
  min-height:115px;
  border-top:1px solid var(--line);
  border-right:1px solid var(--line);
  padding:7px;
}

.day:nth-child(7n){
  border-right:0;
}

.daynum{
  font-size:12px;
  font-weight:700;
}

.today{
  outline:2px solid #111;
  outline-offset:-2px;
}

.event{
  display:block;
  margin-top:5px;
  padding:5px 6px;
  border-radius:6px;
  background:#111;
  color:#fff;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.event.accepted{
  background:#e8f6ed;
  color:var(--green);
}

.event.rejected{
  background:#fdecea;
  color:var(--red);
}

.event.expired{
  background:#eee;
  color:#666;
}

.preview{
  max-width:850px;
  margin:auto;
  background:#fff;
  padding:42px;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
}

.preview-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-bottom:2px solid #111;
  padding-bottom:22px;
}

.preview h1{
  font-size:32px;
  margin:0;
}

.preview table{
  width:100%;
  border-collapse:collapse;
  margin-top:30px;
}

.preview th,
.preview td{
  padding:10px 5px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.sum{
  margin-left:auto;
  width:280px;
  margin-top:25px;
}

.sumline{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
}

.grand{
  border-top:1px solid #111;
  padding-top:12px;
  margin-top:5px;
  font-size:19px;
  font-weight:800;
}

.customer-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.customer-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:18px;
}

.customer-card h3{
  margin:0 0 7px;
}

.customer-card p{
  margin:4px 0;
  color:var(--muted);
  font-size:14px;
}

.itemrow{
  display:grid;
  grid-template-columns:2fr .7fr .9fr 1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:10px;
}

.itemrow input,
.itemrow select{
  width:100%;
  padding:9px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
}

.item-label{
  font-size:11px;
  color:var(--muted);
  margin-bottom:4px;
}

.ai-box{
  background:#111;
  color:#fff;
  border-radius:14px;
  padding:22px;
}

.ai-box h2{
  margin:0 0 6px;
}

.ai-box p{
  color:#aaa;
}

.ai-box textarea{
  width:100%;
  min-height:145px;
  border:0;
  border-radius:10px;
  padding:14px;
  outline:none;
}

.ai-result{
  border:1px solid #444;
  border-radius:10px;
  padding:14px;
  margin-top:14px;
  background:#222;
}

.steps{
  display:flex;
  gap:7px;
  margin-bottom:18px;
  overflow:auto;
}

.step{
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:20px;
  color:#777;
  white-space:nowrap;
}

.step.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

.wizard-actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:18px;
}

.catalog-toolbar{
  display:flex;
  gap:10px;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
  flex-wrap:wrap;
}

.search{
  min-width:250px;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:9px;
  outline:none;
}

.catalog-summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:18px;
}

.catalog-stat{
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
}

.catalog-stat span{
  color:var(--muted);
  font-size:12px;
}

.catalog-stat b{
  display:block;
  font-size:20px;
  margin-top:5px;
}

.margin-positive{
  color:var(--green);
  font-weight:700;
}

.margin-negative{
  color:var(--red);
  font-weight:700;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:50;
}

.modal-box{
  width:min(650px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:16px;
  padding:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.modal-head h2{
  margin:0;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

.hidden{
  display:none!important;
}

.mobilebar{
  display:none;
}

.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  color:#fff;
  padding:12px 16px;
  border-radius:9px;
  z-index:60;
}

.empty{
  padding:30px 10px;
  text-align:center;
  color:var(--muted);
}

.offer-meta{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:8px;
}

.profit-box{
  background:#f8f8f8;
  border:1px solid var(--line);
  border-radius:10px;
  padding:14px;
  margin-top:15px;
}

.profit-row{
  display:flex;
  justify-content:space-between;
  padding:5px 0;
}

.quick-actions{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

@media(max-width:1100px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .customer-grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:950px){

  .grid2{
    grid-template-columns:1fr;
  }

  .kpi{
    grid-template-columns:1fr 1fr;
  }

  .catalog-summary{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:650px){

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    padding:16px;
    padding-bottom:90px;
  }

  .top{
    align-items:flex-start;
  }

  .top h1{
    font-size:24px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .formgrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .customer-grid{
    grid-template-columns:1fr;
  }

  .itemrow{
    grid-template-columns:1fr 1fr;
  }

  .itemrow .itemname{
    grid-column:1/-1;
  }

  .itemrow .remove-item{
    grid-column:1/-1;
  }

  .preview{
    padding:22px;
  }

  .preview-head{
    flex-direction:column;
  }

  .preview table{
    font-size:12px;
  }

  .calendar{
    font-size:11px;
  }

  .day{
    min-height:85px;
    padding:4px;
  }

  .event{
    font-size:9px;
    padding:3px;
  }

  .catalog-summary{
    grid-template-columns:1fr;
  }

  .search{
    min-width:0;
    width:100%;
  }

  .catalog-toolbar{
    align-items:stretch;
  }

  .catalog-toolbar .btn{
    width:100%;
  }

  .mobilebar{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111;
    z-index:20;
    justify-content:space-around;
    padding:9px 4px;
  }

  .mobilebar button{
    background:none;
    border:0;
    color:#aaa;
    font-size:10px;
  }

  .mobilebar button.active{
    color:#fff;
  }

  .modal{
    align-items:flex-end;
    padding:0;
  }

  .modal-box{
    width:100%;
    max-height:92vh;
    border-radius:16px 16px 0 0;
  }

  .table th,
  .table td{
    white-space:nowrap;
  }
}

@media print{

  .sidebar,
  .mobilebar,
  .top,
  .no-print{
    display:none!important;
  }

  .main{
    margin:0;
    padding:0;
  }

  .panel{
    border:0;
    box-shadow:none;
    padding:0;
  }

  .preview{
    box-shadow:none;
    border:0;
    max-width:none;
  }
}
</style>
</head>

<body>

<aside class="sidebar">

  <div class="brand">
    Easy<span>Offer</span>
  </div>

  <div class="nav">

    <button data-page="dashboard" class="active">
      ▦ &nbsp; Dashboard
    </button>

    <button data-page="offers">
      ▤ &nbsp; Angebote
    </button>

    <button data-page="calendar">
      ◫ &nbsp; Kalender
    </button>

    <button data-page="analytics">
      ◒ &nbsp; Analyse
    </button>

    <button data-page="customers">
      ♙ &nbsp; Kunden
    </button>

    <button data-page="catalog">
      ▧ &nbsp; Preiskatalog
    </button>

    <button data-page="settings">
      ⚙ &nbsp; Einstellungen
    </button>

  </div>

</aside>

<main class="main" id="main"></main>

<div class="mobilebar">

  <button data-page="dashboard" class="active">
    Home
  </button>

  <button data-page="offers">
    Angebote
  </button>

  <button data-page="calendar">
    Kalender
  </button>

  <button data-page="analytics">
    Analyse
  </button>

  <button data-page="settings">
    Mehr
  </button>

</div>

<div id="toast" class="toast hidden"></div>

<div id="modal" class="modal hidden"></div>

<script>
"use strict";

const KEY="easyoffer_v22";

const catalogDefault=[
  {
    id:"1",
    articleNo:"SHK-001",
    name:"Gas-Brennwerttherme",
    unit:"Stk.",
    price:3200,
    cost:2200
  },
  {
    id:"2",
    articleNo:"SHK-002",
    name:"Wärmepumpe",
    unit:"Stk.",
    price:8500,
    cost:6100
  },
  {
    id:"3",
    articleNo:"SHK-003",
    name:"Heizkörper",
    unit:"Stk.",
    price:420,
    cost:260
  },
  {
    id:"4",
    articleNo:"SHK-004",
    name:"Waschtisch",
    unit:"Stk.",
    price:280,
    cost:150
  },
  {
    id:"5",
    articleNo:"SHK-005",
    name:"Toilette",
    unit:"Stk.",
    price:390,
    cost:210
  },
  {
    id:"6",
    articleNo:"SHK-006",
    name:"Montage / Arbeitszeit",
    unit:"Std.",
    price:65,
    cost:32
  },
  {
    id:"7",
    articleNo:"SHK-007",
    name:"Demontage",
    unit:"Std.",
    price:55,
    cost:28
  },
  {
    id:"8",
    articleNo:"SHK-008",
    name:"Anfahrt",
    unit:"Pausch.",
    price:45,
    cost:15
  }
];

const defaults={
  settings:{
    company:"Muster SHK GmbH",
    owner:"Max Mustermann",
    address:"Musterstraße 1\n34117 Kassel",
    iban:"DE00 0000 0000 0000 0000 00"
  },
  catalog:catalogDefault,
  offers:[],
  nextNo:1001
};

let state;

try{

  state=
    JSON.parse(
      localStorage.getItem(KEY)||"null"
    )||defaults;

}catch(e){

  state=defaults;

}

/*
  Migration von älteren EasyOffer-Versionen.
*/

if(!state.catalog){
  state.catalog=[];
}

if(!state.offers){
  state.offers=[];
}

if(!state.settings){
  state.settings=defaults.settings;
}

if(!state.nextNo){
  state.nextNo=1001;
}

if(!state.catalog.length){

  state.catalog=
    catalogDefault.map(x=>({...x}));

}

/*
  Alte Katalogartikel bekommen automatisch
  eine Artikelnummer.
*/

state.catalog.forEach((item,index)=>{

  if(!item.id){
    item.id=
      String(Date.now())+
      String(index);
  }

  if(!item.articleNo){
    item.articleNo=
      "SHK-"+String(index+1).padStart(3,"0");
  }

  if(item.price===undefined){
    item.price=0;
  }

  if(item.cost===undefined){
    item.cost=0;
  }

});

let page="dashboard";

let monthCursor=new Date();

let catalogSearch="";

let draft={
  step:1,
  customer:{
    company:"",
    email:"",
    phone:"",
    address:""
  },
  request:"",
  items:[],
  notes:"",
  followDate:""
};

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

}

function money(n){

  return new Intl.NumberFormat(
    "de-DE",
    {
      style:"currency",
      currency:"EUR"
    }
  ).format(Number(n)||0);

}

function number(n){

  return Number(n)||0;

}

function esc(s){

  return String(s??"").replace(
    /[&<>"']/g,
    m=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#39;"
    }[m])
  );

}

function toast(message){

  const box=
    document.getElementById("toast");

  box.textContent=message;

  box.classList.remove("hidden");

  setTimeout(()=>{
    box.classList.add("hidden");
  },2200);

}

function totals(o){

  const net=
    (o.items||[]).reduce(
      (sum,item)=>
        sum+
        number(item.qty)*
        number(item.price),
      0
    );

  return{
    net,
    vat:net*.19,
    gross:net*1.19
  };

}

function offerProfit(o){

  return (o.items||[]).reduce(
    (sum,item)=>{

      const cost=
        item.cost!==undefined
        ?number(item.cost)
        :catalogCost(item.name);

      return sum+
        number(item.qty)*
        (
          number(item.price)-
          cost
        );

    },
    0
  );

}

function offerMarginPercent(o){

  const net=totals(o).net;

  if(!net)return 0;

  return Math.round(
    offerProfit(o)/net*100
  );

}

function catalogCost(name){

  const item=
    state.catalog.find(
      x=>
        x.name.toLowerCase()===
        String(name||"").toLowerCase()
    );

  return item
    ?number(item.cost)
    :0;

}

function status(o){

  return o.status||"Offen";

}

function badge(s){

  let cls="";

  if(s==="Angenommen")cls="green";
  if(s==="Abgelehnt")cls="red";
  if(s==="Offen")cls="orange";
  if(s==="Entwurf")cls="blue";
  if(s==="Abgelaufen")cls="red";

function editOffer(id){

  const offer=
    state.offers.find(
      x=>x.id===id
    );

  if(!offer)return;

  draft={
    step:3,

    editingId:id,

    customer:{
      company:
        offer.customer.company||"",
      email:
        offer.customer.email||"",
      phone:
        offer.customer.phone||"",
      address:
        offer.customer.address||""
    },

    request:
      offer.request||"",

    items:
      (offer.items||[]).map(
        x=>({...x})
      ),

    notes:
      offer.notes||"",

    followDate:
      offer.followDate||""

  };

  page="create";

  render();

}

function duplicateOffer(id){

  const original=
    state.offers.find(
      x=>x.id===id
    );

  if(!original)return;

  const copy={
    ...original,

    id:
      createId(),

    no:
      `EO-${state.nextNo++}`,

    date:
      todayString(),

    followDate:
      addDays(7),

    status:"Entwurf",

    items:
      (original.items||[]).map(
        x=>({...x})
      ),

    customer:{
      ...original.customer
    }

  };

  state.offers.push(copy);

  save();

  toast(
    `Angebot ${copy.no} erstellt`
  );

  preview(copy.id);

}

function deleteOffer(id){

  const offer=
    state.offers.find(
      x=>x.id===id
    );

  if(!offer)return;

  const yes=
    confirm(
      `Angebot ${offer.no} wirklich löschen?`
    );

  if(!yes)return;

  state.offers=
    state.offers.filter(
      x=>x.id!==id
    );

  save();

  toast("Angebot gelöscht");

  go("offers");

}

/* =========================
   CALENDAR
========================= */

function calendar(){

  const year=
    monthCursor.getFullYear();

  const month=
    monthCursor.getMonth();

  const first=
    new Date(
      year,
      month,
      1
    );

  const days=
    new Date(
      year,
      month+1,
      0
    ).getDate();

  const start=
    (first.getDay()+6)%7;

  const names=[
    "Mo",
    "Di",
    "Mi",
    "Do",
    "Fr",
    "Sa",
    "So"
  ];

  let cells=
    names.map(
      name=>`
        <div class="cal-dayname">
          ${name}
        </div>
      `
    ).join("");

  for(
    let i=0;
    i<start;
    i++
  ){

    cells+=
      `<div class="day"></div>`;

  }

  const today=
    new Date();

  for(
    let day=1;
    day<=days;
    day++
  ){

    const date=
      `${year}-${String(month+1)
        .padStart(2,"0")}-${String(day)
        .padStart(2,"0")}`;

    const events=
      state.offers.filter(
        o=>o.followDate===date
      );

    const isToday=
      today.getFullYear()===year &&
      today.getMonth()===month &&
      today.getDate()===day;

    cells+=`

      <div
        class="day ${isToday?"today":""}"
      >

        <div class="daynum">
          ${day}
        </div>

        ${events.map(o=>`

          <div
            class="event ${
              status(o)==="Angenommen"
              ?"accepted"
              :status(o)==="Abgelehnt"
              ?"rejected"
              :status(o)==="Abgelaufen"
              ?"expired"
              :""
            }"
            onclick="preview('${o.id}')"
          >

            ${esc(o.no)}
            ·
            ${esc(
              o.customer.company||
              "Kunde"
            )}

          </div>

        `).join("")}

      </div>

    `;

  }

  const todayStr=
    todayString();

  const upcoming=
    state.offers
    .filter(o=>
      o.followDate &&
      o.followDate>=todayStr &&
      status(o)==="Offen"
    )
    .sort(
      (a,b)=>
        a.followDate.localeCompare(
          b.followDate
        )
    )
    .slice(0,10);

  const overdue=
    state.offers
    .filter(o=>
      o.followDate &&
      o.followDate<todayStr &&
      status(o)==="Offen"
    )
    .sort(
      (a,b)=>
        b.followDate.localeCompare(
          a.followDate
        )
    )
    .slice(0,10);

  layout(
    "Kalender",
    "Follow-ups und Angebote verfolgen",

    `

    <div class="panel">

      <div class="calendar-head">

        <button
          class="btn"
          onclick="
            monthCursor.setMonth(
              monthCursor.getMonth()-1
            );
            calendar();
          "
        >
          ‹
        </button>

        <h2 style="margin:0">
          ${new Intl.DateTimeFormat(
            "de-DE",
            {
              month:"long",
              year:"numeric"
            }
          ).format(monthCursor)}
        </h2>

        <button
          class="btn"
          onclick="
            monthCursor.setMonth(
              monthCursor.getMonth()+1
            );
            calendar();
          "
        >
          ›
        </button>

      </div>

      <div class="calendar">
        ${cells}
      </div>

    </div>

    <div class="grid2">

      <div class="panel">

        <h2>
          Überfällige Follow-ups
        </h2>

        ${
          overdue.length
          ?overdue.map(
            o=>followCard(o,true)
          ).join("")
          :`
            <div class="muted">
              Keine überfälligen Follow-ups.
            </div>
          `
        }

      </div>

      <div class="panel">

        <h2>
          Anstehende Follow-ups
        </h2>

        ${
          upcoming.length
          ?upcoming.map(
            o=>followCard(o,false)
          ).join("")
          :`
            <div class="muted">
              Keine offenen Follow-ups geplant.
            </div>
          `
        }

      </div>

    </div>

    `
  );

}

function followCard(o,overdue){

  const profit=

  const average=

function customers(){

  const map={};

  state.offers.forEach(
    offer=>{

      const key=
        offer.customer.company||
        "Unbekannt";

      if(!map[key]){

        map[key]={
          customer:
            offer.customer,
          count:0,
          value:0,
          won:0
        };

      }

      map[key].count++;

      map[key].value+=
        totals(offer).gross;

      if(status(offer)==="Angenommen"){
        map[key].won+=
          totals(offer).gross;
      }

    }
  );

  layout(
    "Kunden",
    "Kunden aus deinen Angeboten",

    `

    <div class="customer-grid">

      ${
        Object.values(map)

function catalog(){

  const filtered=
    state.catalog
    .filter(item=>{

      const q=
        catalogSearch
        .trim()
        .toLowerCase();

      if(!q)return true;

      return[
        item.articleNo,
        item.name,
        item.unit
      ]
      .join(" ")
      .toLowerCase()
      .includes(q);

    });

  const totalMargin=
    state.catalog.reduce(
      (sum,x)=>
        sum+
        (
          number(x.price)-
          number(x.cost)
        ),
      0
    );

  const avgMargin=
    state.catalog.length
    ?state.catalog.reduce(
      (sum,x)=>{

        const p=
          number(x.price);

        const c=
          number(x.cost);

        return sum+
          (
            p
            ?(p-c)/p*100
            :0
          );

      },
      0
    )/state.catalog.length
    :0;

  layout(
    "Preiskatalog",
    "Deine Preise und internen Kosten",
    `

        <div class="catalog-stat">

          <span>
            Artikel
          </span>

            ${state.catalog.length}
          </b>

        </div>

        <div class="catalog-stat">

          <span>
            Gesamtmarge je Einheit
          </span>

          <b>
            ${money(totalMargin)}
          </b>

        </div>

        <div class="catalog-stat">

          <span>
            Ø Marge
          </span>

          <b>
            ${Math.round(avgMargin)}%
          </b>

        </div>

      </div>

      <div class="catalog-toolbar">

        <input
          class="search"
          placeholder="Artikel suchen..."
          value="${esc(catalogSearch)}"
          oninput="catalogSearch=this.value;catalog()"
        >

        <button
          class="btn dark"
          onclick="openCatalogModal()"
        >
          + Artikel hinzufügen
        </button>

      </div>

      <div class="table-wrap">

        <table class="table">

          <thead>

            <tr>
              <th>Artikel-Nr.</th>
              <th>Leistung</th>
              <th>Einheit</th>
              <th>Verkauf</th>
              <th>Einkauf</th>
              <th>Marge</th>
              <th></th>
            </tr>

          </thead>

          <tbody>

            ${

                catalogRow

                  <td

    document.getElementById(
      "catalogPreview"

  if(!box)return;

  box.innerHTML=`

function saveCatalogItem(id){

  const articleNo=
    document.getElementById(
      "catArticleNo"
    ).value.trim();

  const name=
    document.getElementById(
      "catName"
    ).value.trim();

  const unit=
    document.getElementById(
      "catUnit"
    ).value;

  const price=
    number(
      document.getElementById(
        "catPrice"
      ).value
    );

  const cost=
    number(
      document.getElementById(
        "catCost"
      ).value
    );

  if(!name){

    toast(
      "Bitte eine Bezeichnung eingeben"
    );

    return;

  }

  if(id){

    const item=
      state.catalog.find(
        x=>x.id===id
      );

    if(!item)return;

    item.articleNo=
      articleNo||
      item.articleNo;

    item.name=name;
    item.unit=unit;
    item.price=price;
    item.cost=cost;

    toast("Artikel aktualisiert");

  }else{

    const newItem={

      id:createId(),

      articleNo:
        articleNo||
        nextArticleNo(),

      name,
      unit,
      price,
      cost

    };

    state.catalog.push(
      newItem
    );

    toast("Artikel hinzugefügt");

  }

  save();

  closeModal();

  catalog();

}

function nextArticleNo(){

  return`
    SHK-${String(
      state.catalog.length+1
    ).padStart(3,"0")}
  `;

}

function deleteCatalogItem(id){

  const item=
    state.catalog.find(
      x=>x.id===id
    );

  if(!item)return;

  const yes=
    confirm(
      `"${item.name}" wirklich löschen?`
    );

  if(!yes)return;

  state.catalog=
    state.catalog.filter(
      x=>x.id!==id
    );

  save();

  toast("Artikel gelöscht");

  catalog();

}

    draft.items=
      draft.items.map(item=>{

        if(
          item.cost===undefined||
          item.cost===null

            catalogCost(item.name);

        }

        return item;

      });

function analyze(){

  draft.request=
    document.getElementById(
      "request"
    ).value;

  const text=
    draft.request.toLowerCase();

  draft.items=[];

  state.catalog.forEach(
    item=>{

      const name=
        item.name.toLowerCase();

      let found=
        text.includes(name);

      const aliases={

        "wärmepumpe":[
          "wärmepumpe",
          "wp",
          "luftwärmepumpe",
          "luft wasser wärmepumpe"
        ],

        "gas-brennwerttherme":[
          "gastherme",
          "brennwerttherme",
          "gasheizung"
        ],

        "heizkörper":[
          "heizkörper",
          "heizkörper",
          "radiator"
        ],

        "waschtisch":[
          "waschtisch",
          "waschbecken",
          "waschplatz"
        ],

        "toilette":[
          "toilette",
          "wc",
          "klo"
        ],

        "montage / arbeitszeit":[
          "montage",
          "arbeitszeit",
          "einbau",
          "installation"
        ],

        "demontage":[
          "demontage",
          "ausbau",
          "abbau"
        ],

        "anfahrt":[
          "anfahrt",
          "fahrt",
          "anfahrtskosten"
        ]

      };

      const list=
        aliases[name]||[];

      if(
        list.some(
          alias=>
            text.includes(alias)
        )
      ){

        found=true;

      }

      if(found){

        let qty=
          detectQuantity(
            text,
            list.length
            ?list
            :[name]
          );

        draft.items.push({

          name:item.name,

          articleNo:
            item.articleNo,

          unit:item.unit,

          qty,

          price:
            number(item.price),

          cost:
            number(item.cost)

        });

      }

    }
  );

  toast(
    draft.items.length
    ?`${draft.items.length} Position(en) erkannt`
    :"Keine Position erkannt"
  );

  render();

}

function detectQuantity(
  text,
  aliases
){

  for(
    const alias of aliases
  ){

    const escaped=
      alias.replace(
        /[.*+?^${}()|[\]\\]/g,
        "\\$&"
      );

    const regex=
      new RegExp(
        `(\\d+(?:[,.]\\d+)?)\\s*(?:x|stück|stk\\.?|mal)?\\s*(?:${escaped})`,
        "i"
      );

    const match=
      text.match(regex);

    if(match){

      return number(
        String(
          match[1]
        ).replace(",",".")
      )||1;

    }

  }

  const generic=
    text.match(
      /(\d+)\s*(x|stück|stk|mal)/i
    );

  return generic
    ?number(generic[1])
    :1;

}

function saveOffer(){

  const offer={

    id:createId(),

    no:
      `EO-${state.nextNo++}`,

    date:
      todayString(),

    followDate:
      draft.followDate||
      addDays(7),

    customer:{
      ...draft.customer
    },

    items:
      draft.items.map(
        item=>({

          ...item,

          qty:number(item.qty),
          price:number(item.price),

          cost:
            item.cost!==undefined
            ?number(item.cost)
            :catalogCost(
              item.name
            )

        })
      ),

    notes:
      draft.notes,

    request:
      draft.request,

    status:"Offen"

  };

  state.offers.push(
    offer
  );

  save();

  toast("Angebot gespeichert");

  preview(offer.id);

}

function updateOffer(){

  const offer=
    state.offers.find(
      x=>x.id===draft.editingId
    );

  if(!offer){

    toast(
      "Angebot nicht gefunden"
    );

    return;

  }

  offer.customer={
    ...draft.customer
  };

  offer.items=
    draft.items.map(
      item=>({

        ...item,

        qty:number(item.qty),
        price:number(item.price),

        cost:
          item.cost!==undefined
          ?number(item.cost)
          :catalogCost(
            item.name
          )

      })
    );

  offer.notes=
    draft.notes;

  offer.request=
    draft.request;

  offer.followDate=
    draft.followDate||
    addDays(7);

  save();

  toast("Angebot aktualisiert");

  preview(offer.id);

}

function createId(){

  if(
    window.crypto &&
    crypto.randomUUID
  ){

    return crypto.randomUUID();

  }

  return String(
    Date.now()
  )+
  String(
    Math.random()
  ).slice(2);

}

function todayString(){

  const d=
    new Date();

  return`
    ${d.getFullYear()}-
    ${String(
      d.getMonth()+1
    ).padStart(2,"0")}-
    ${String(
      d.getDate()
    ).padStart(2,"0")}
  `.replace(/\s/g,"");

}

function addDays(days){

  const d=
    new Date();

  d.setDate(
    d.getDate()+days
  );

  return`
    ${d.getFullYear()}-
    ${String(
      d.getMonth()+1
    ).padStart(2,"0")}-
    ${String(
      d.getDate()
    ).padStart(2,"0")}
  `.replace(/\s/g,"");

}

/*
  Kleine Korrektur für Gewinnanzeige:
  Einkaufssumme wird separat berechnet.
*/

const originalTotals=
  totals;

function totals(o){

  const net=
    (o.items||[]).reduce(
      (sum,item)=>
        sum+
        number(item.qty)*
        number(item.price),
      0
    );

  const cost=
    (o.items||[]).reduce(
      (sum,item)=>
        sum+
        number(item.qty)*
        (
          item.cost!==undefined
          ?number(item.cost)
          :catalogCost(item.name)
        ),
      0
    );

  return{

    net,

    cost,

    profit:
      net-cost,

    vat:
      net*.19,

    gross:
      net*1.19

  };

}
