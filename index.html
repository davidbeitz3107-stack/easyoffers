<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>EasyOffer v2.2</title>

<style>
:root{
  --bg:#f4f4f5;
  --panel:#fff;
  --text:#111;
  --muted:#737373;
  --line:#e4e4e7;
  --dark:#111;
  --green:#16803c;
  --orange:#a15c00;
  --red:#b42318;
  --shadow:0 8px 30px rgba(0,0,0,.06);
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,
input,
textarea,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.sidebar{
  width:240px;
  background:#111;
  color:#fff;
  padding:22px 14px;
  position:fixed;
  inset:0 auto 0 0;
  z-index:10;
}

.brand{
  font-size:23px;
  font-weight:800;
  padding:5px 10px 28px;
}

.brand span{
  color:#999;
}

.nav button{
  width:100%;
  background:none;
  border:0;
  color:#aaa;
  text-align:left;
  padding:12px;
  border-radius:9px;
  margin:2px 0;
}

.nav button:hover,
.nav button.active{
  background:#292929;
  color:#fff;
}

.main{
  margin-left:240px;
  padding:28px;
  max-width:1600px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:24px;
}

.top h1{
  margin:0;
  font-size:28px;
}

.sub{
  color:var(--muted);
  margin-top:5px;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  padding:10px 15px;
  border-radius:9px;
  font-weight:650;
}

.btn.dark{
  background:#111;
  color:#fff;
  border-color:#111;
}

.btn.small{
  padding:7px 10px;
  font-size:13px;
}

.btn.danger{
  color:var(--red);
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card,
.panel,
.feature{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
}

.card{
  padding:19px;
}

.card .label{
  color:var(--muted);
  font-size:13px;
}

.card .value{
  font-size:27px;
  font-weight:800;
  margin-top:8px;
}

.panel{
  padding:20px;
  margin-top:18px;
}

.panel h2{
  font-size:17px;
  margin:0 0 16px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#555;
  margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  background:#fff;
  outline:none;
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.table-wrap{
  overflow-x:auto;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  text-align:left;
  padding:11px 8px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

.table th{
  color:var(--muted);
  font-size:12px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  background:#eee;
}

.badge.green{
  background:#e8f6ed;
  color:var(--green);
}

.badge.orange{
  background:#fff2df;
  color:var(--orange);
}

.badge.red{
  background:#fdecea;
  color:var(--red);
}

.badge.gray{
  background:#eee;
  color:#666;
}

.bar{
  height:12px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  background:#111;
}

.kpi{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.mini{
  padding:14px;
  border:1px solid var(--line);
  border-radius:10px;
}

.mini b{
  display:block;
  font-size:22px;
  margin-top:5px;
}

.chart{
  height:250px;
  display:flex;
  align-items:flex-end;
  gap:12px;
  padding:15px 5px 25px;
  border-bottom:1px solid var(--line);
}

.chartcol{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
}

.chartcol i{
  width:70%;
  max-width:50px;
  background:#111;
  border-radius:5px 5px 0 0;
  min-height:3px;
}

.chartcol span{
  font-size:11px;
  color:var(--muted);
}

.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

.cal-dayname{
  padding:10px;
  background:#f8f8f8;
  font-size:12px;
  font-weight:700;
  color:#666;
}

.day{
  min-height:115px;
  border-top:1px solid var(--line);
  border-right:1px solid var(--line);
  padding:7px;
}

.day:nth-child(7n){
  border-right:0;
}

.daynum{
  font-size:12px;
  font-weight:700;
}

.today{
  outline:2px solid #111;
  outline-offset:-2px;
}

.event{
  display:block;
  margin-top:5px;
  padding:5px 6px;
  border-radius:6px;
  background:#111;
  color:#fff;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.event.accepted{
  background:#e8f6ed;
  color:var(--green);
}

.event.rejected{
  background:#fdecea;
  color:var(--red);
}

.event.expired{
  background:#eee;
  color:#666;
}

.preview{
  max-width:850px;
  margin:auto;
  background:#fff;
  padding:42px;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
}

.preview-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-bottom:2px solid #111;
  padding-bottom:22px;
}

.preview h1{
  font-size:32px;
  margin:0;
}

.preview table{
  width:100%;
  border-collapse:collapse;
  margin-top:30px;
}

.preview th,
.preview td{
  padding:10px 5px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.sum{
  margin-left:auto;
  width:280px;
  margin-top:25px;
}

.sumline{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
}

.grand{
  border-top:1px solid #111;
  padding-top:12px;
  margin-top:5px;
  font-size:19px;
  font-weight:800;
}

.customer-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.customer-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:18px;
}

.customer-card h3{
  margin:0 0 7px;
}

.customer-card p{
  margin:4px 0;
  color:var(--muted);
  font-size:14px;
}

.itemrow{
  display:grid;
  grid-template-columns:2fr .65fr .9fr 1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:10px;
}

.itemrow input,
.itemrow select{
  width:100%;
  padding:9px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
}

.ai-box{
  background:#111;
  color:#fff;
  border-radius:14px;
  padding:22px;
}

.ai-box h2{
  margin:0 0 6px;
}

.ai-box p{
  color:#aaa;
}

.ai-box textarea{
  width:100%;
  min-height:145px;
  border:0;
  border-radius:10px;
  padding:14px;
  outline:none;
}

.ai-result{
  border:1px solid #444;
  border-radius:10px;
  padding:14px;
  margin-top:14px;
  background:#222;
}

.steps{
  display:flex;
  gap:7px;
  margin-bottom:18px;
  overflow:auto;
}

.step{
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:20px;
  color:#777;
  white-space:nowrap;
}

.step.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

.wizard-actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:18px;
}

.toolbar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
}

.search{
  min-width:220px;
}

.profit{
  font-weight:700;
}

.muted{
  color:var(--muted);
}

.empty{
  padding:25px 5px;
  color:var(--muted);
}

.overdue{
  color:var(--red);
  font-weight:700;
}

.mobilebar{
  display:none;
}

.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  color:#fff;
  padding:12px 16px;
  border-radius:9px;
  z-index:50;
}

.hidden{
  display:none!important;
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:40;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
}

.modal{
  background:#fff;
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  border-radius:16px;
  padding:20px;
  box-shadow:0 20px 60px rgba(0,0,0,.2);
}

.modal-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  align-items:center;
  margin-bottom:16px;
}

.modal-head h2{
  margin:0;
}

.modal-actions{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:18px;
}

.notice{
  padding:11px 13px;
  border-radius:9px;
  background:#f8f8f8;
  margin-top:10px;
  font-size:13px;
}

@media(max-width:950px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .grid2{
    grid-template-columns:1fr;
  }

  .customer-grid{
    grid-template-columns:1fr 1fr;
  }

  .kpi{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:650px){

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    padding:16px;
    padding-bottom:90px;
  }

  .top{
    align-items:flex-start;
  }

  .top h1{
    font-size:24px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .formgrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .customer-grid{
    grid-template-columns:1fr;
  }

  .itemrow{
    grid-template-columns:1fr 1fr 1fr;
  }

  .itemrow .itemname{
    grid-column:1/-1;
  }

  .preview{
    padding:22px;
  }

  .preview-head{
    flex-direction:column;
  }

  .calendar{
    font-size:11px;
  }

  .day{
    min-height:85px;
    padding:4px;
  }

  .event{
    font-size:9px;
    padding:3px;
  }

  .mobilebar{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111;
    z-index:20;
    justify-content:space-around;
    padding:9px 4px;
  }

  .mobilebar button{
    background:none;
    border:0;
    color:#aaa;
    font-size:10px;
  }

  .mobilebar button.active{
    color:#fff;
  }

  .table{
    min-width:760px;
  }

  .search{
    min-width:180px;
  }
}

@media print{

  .sidebar,
  .mobilebar,
  .top,
  .no-print{
    display:none!important;
  }

  .main{
    margin:0;
    padding:0;
  }

  .panel{
    border:0;
    box-shadow:none;
    padding:0;
  }

  .preview{
    box-shadow:none;
    border:0;
    max-width:none;
  }
}
</style>
</head>

<body>

<aside class="sidebar">

  <div class="brand">
    Easy<span>Offer</span>
  </div>

  <div class="nav">

    <button data-page="dashboard" class="active">
      ▦ &nbsp; Dashboard
    </button>

    <button data-page="offers">
      ▤ &nbsp; Angebote
    </button>

    <button data-page="calendar">
      ◫ &nbsp; Kalender
    </button>

    <button data-page="analytics">
      ◒ &nbsp; Analyse
    </button>

    <button data-page="customers">
      ♙ &nbsp; Kunden
    </button>

    <button data-page="catalog">
      ▧ &nbsp; Preiskatalog
    </button>

    <button data-page="settings">
      ⚙ &nbsp; Einstellungen
    </button>

  </div>

</aside>

<main class="main" id="main"></main>

<div class="mobilebar">

  <button data-page="dashboard" class="active">
    Home
  </button>

  <button data-page="offers">
    Angebote
  </button>

  <button data-page="calendar">
    Kalender
  </button>

  <button data-page="analytics">
    Analyse
  </button>

  <button data-page="settings">
    Mehr
  </button>

</div>

<div id="toast" class="toast hidden"></div>

<div id="modalRoot"></div>

<script>
"use strict";

/* =========================================================
   EASY OFFER v2.2
   ========================================================= */

const OLD_KEY = "easyoffer_v21";
const KEY = "easyoffer_v22";


/* =========================================================
   DEFAULT CATALOG
   ========================================================= */

const catalogDefault = [

  {
    id:"1",
    articleNo:"SHK-001",
    name:"Gas-Brennwerttherme",
    unit:"Stk.",
    price:3200,
    cost:2200
  },

  {
    id:"2",
    articleNo:"SHK-002",
    name:"Wärmepumpe",
    unit:"Stk.",
    price:8500,
    cost:6100
  },

  {
    id:"3",
    articleNo:"SHK-003",
    name:"Heizkörper",
    unit:"Stk.",
    price:420,
    cost:260
  },

  {
    id:"4",
    articleNo:"SHK-004",
    name:"Waschtisch",
    unit:"Stk.",
    price:280,
    cost:150
  },

  {
    id:"5",
    articleNo:"SHK-005",
    name:"Toilette",
    unit:"Stk.",
    price:390,
    cost:210
  },

  {
    id:"6",
    articleNo:"SHK-006",
    name:"Montage / Arbeitszeit",
    unit:"Std.",
    price:65,
    cost:32
  },

  {
    id:"7",
    articleNo:"SHK-007",
    name:"Demontage",
    unit:"Std.",
    price:55,
    cost:28
  },

  {
    id:"8",
    articleNo:"SHK-008",
    name:"Anfahrt",
    unit:"Pausch.",
    price:45,
    cost:15
  }

];


/* =========================================================
   DEFAULT STATE
   ========================================================= */

const defaults = {

  settings:{
    company:"Muster SHK GmbH",
    owner:"Max Mustermann",
    address:"Musterstraße 1\n34117 Kassel",
    iban:"DE00 0000 0000 0000 0000 00"
  },

  catalog:catalogDefault,

  offers:[],

  nextNo:1001

};


/* =========================================================
   STATE LOAD + MIGRATION
   ========================================================= */

let state = null;

try{

  const current =
    JSON.parse(
      localStorage.getItem(KEY) || "null"
    );

  if(current){

    state=current;

  }else{

    const old =
      JSON.parse(
        localStorage.getItem(OLD_KEY) || "null"
      );

    state =
      old ||
      JSON.parse(JSON.stringify(defaults));

  }

}catch(error){

  state =
    JSON.parse(JSON.stringify(defaults));

}


/* =========================================================
   STATE REPAIR
   ========================================================= */

if(!Array.isArray(state.catalog) || !state.catalog.length){

  state.catalog =
    JSON.parse(
      JSON.stringify(catalogDefault)
    );

}

if(!Array.isArray(state.offers)){

  state.offers=[];

}

if(!state.settings){

  state.settings =
    JSON.parse(
      JSON.stringify(defaults.settings)
    );

}

if(!state.nextNo){

  state.nextNo=1001;

}


/* =========================================================
   NORMALIZE CATALOG
   ========================================================= */

state.catalog =
  state.catalog.map(
    (item,index)=>({

      ...item,

      id:String(
        item.id ||
        Date.now()+index
      ),

      articleNo:
        item.articleNo ||
        `SHK-${String(index+1).padStart(3,"0")}`,

      name:
        item.name ||
        "Artikel",

      unit:
        item.unit ||
        "Stk.",

      price:
        Number(item.price) || 0,

      cost:
        Number(item.cost) || 0

    })
  );


/* =========================================================
   UI STATE
   ========================================================= */

let page="dashboard";

let monthCursor =
  new Date();

let offerFilter="Alle";

let offerSearch="";

let catalogSearch="";


/* =========================================================
   DRAFT
   ========================================================= */

let draft={

  step:1,

  customer:{
    company:"",
    email:"",
    phone:"",
    address:""
  },

  request:"",

  items:[],

  notes:"",

  followDate:""

};


/* =========================================================
   HELPERS
   ========================================================= */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

}


function money(value){

  return new Intl.NumberFormat(
    "de-DE",
    {
      style:"currency",
      currency:"EUR"
    }
  ).format(
    Number(value) || 0
  );

}


function esc(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    character=>({

      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#39;"

    }[character])
  );

}


function todayISO(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


function toast(message){

  const box =
    document.getElementById(
      "toast"
    );

  box.textContent=message;

  box.classList.remove(
    "hidden"
  );

  clearTimeout(
    window.__easyOfferToast
  );

  window.__easyOfferToast =
    setTimeout(
      ()=>{
        box.classList.add(
          "hidden"
        );
      },
      2200
    );

}


/* =========================================================
   OFFER CALCULATIONS
   ========================================================= */

function totals(offer){

  const net =
    (offer.items || [])
    .reduce(
      (sum,item)=>
        sum +
        (Number(item.qty)||0) *
        (Number(item.price)||0),
      0
    );

  return{

    net,

    vat:
      net * 0.19,

    gross:
      net * 1.19

  };

}


function costTotal(offer){

  return(
    offer.items || []
  ).reduce(
    (sum,item)=>
      sum +
      (Number(item.qty)||0) *
      (Number(item.cost)||0),
    0
  );

}


function profit(offer){

  return(
    totals(offer).net -
    costTotal(offer)
  );

}


function status(offer){

  return (
    offer.status ||
    "Offen"
  );

}


function badge(currentStatus){

  let cls="";

  if(currentStatus==="Angenommen")
    cls="green";

  if(currentStatus==="Abgelehnt")
    cls="red";

  if(currentStatus==="Abgelaufen")
    cls="gray";

  if(currentStatus==="Offen")
    cls="orange";

  return `
    <span class="badge ${cls}">
      ${esc(currentStatus)}
    </span>
  `;

}


/* =========================================================
   NAVIGATION
   ========================================================= */

function nav(){

  document
    .querySelectorAll(
      "[data-page]"
    )
    .forEach(
      button=>{

        button.classList.toggle(
          "active",
          button.dataset.page===page
        );

      }
    );

}


function layout(
  title,
  sub,
  body,
  action=""
){

  document
    .getElementById("main")
    .innerHTML=`

      <div class="top">

        <div>

          <h1>
            ${esc(title)}
          </h1>

          <div class="sub">
            ${sub || ""}
          </div>

        </div>

        ${action}

      </div>

      ${body}

    `;

  nav();

}


/* =========================================================
   DASHBOARD
   ========================================================= */

function dashboard(){

  const offers =
    state.offers;

  const open =
    offers.filter(
      o=>status(o)==="Offen"
    );

  const accepted =
    offers.filter(
      o=>status(o)==="Angenommen"
    );

  const volume =
    offers.reduce(
      (sum,o)=>
        sum + totals(o).gross,
      0
    );

  const won =
    accepted.reduce(
      (sum,o)=>
        sum + totals(o).gross,
      0
    );

  const openValue =
    open.reduce(
      (sum,o)=>
        sum + totals(o).gross,
      0
    );

  const closeRate =
    offers.length
    ? Math.round(
        accepted.length /
        offers.length *
        100
      )
    : 0;

function filteredOffers(){

  let rows =
    state.offers
    .slice()
    .reverse();


  if(
    offerFilter !==
    "Alle"
  ){

    rows =
      rows.filter(
        offer=>
          status(offer) ===
          offerFilter
      );

  }


  if(
    offerSearch.trim()
  ){

    const query =
      offerSearch
      .toLowerCase()
      .trim();

    rows =
      rows.filter(
        offer=>{

          const text =
            [

              offer.no,

              offer.customer?.company,

              offer.customer?.email,

              offer.customer?.phone

            ]
            .join(" ")
            .toLowerCase();

          return text.includes(
            query
          );

        }
      );

  }

  return rows;

}

/* =========================================================
   DUPLICATE OFFER
   ========================================================= */

function duplicateOffer(id){

  const offer =
    state.offers.find(
      x=>x.id===id
    );

  if(!offer)return;


  const copy =
    JSON.parse(
      JSON.stringify(offer)
    );


  copy.id =
    crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now());


  copy.no =
    `EO-${state.nextNo++}`;


  copy.date =
    todayISO();


  copy.status =
    "Offen";


  copy.followDate =
    "";


  state.offers.push(
    copy
  );

  save();

  toast(
    "Angebot dupliziert"
  );

  preview(
    copy.id
  );

}


/* =========================================================
   DELETE OFFER
   ========================================================= */

function deleteOffer(id){

  const offer =
    state.offers.find(
      x=>x.id===id
    );

  if(!offer)return;


  if(
    !confirm(
      `Angebot ${offer.no} wirklich löschen?`
    )
  ){

    return;

  }


  state.offers =
    state.offers.filter(
      x=>x.id!==id
    );


  save();

  toast(
    "Angebot gelöscht"
  );

  go("offers");

}


/* =========================================================
   CALENDAR
   ========================================================= */

function calendar(){

  const year =
    monthCursor.getFullYear();

  const month =
    monthCursor.getMonth();


  const first =
    new Date(
      year,
      month,
      1
    );


  const days =
    new Date(
      year,
      month+1,
      0
    ).getDate();


  const start =
    (first.getDay()+6)%7;


  const names=[
    "Mo",
    "Di",
    "Mi",
    "Do",
    "Fr",
    "Sa",
    "So"
  ];


  let cells =
    names
    .map(
      name=>`

        <div class="cal-dayname">
          ${name}
        </div>

      `
    )
    .join("");


  for(
    let i=0;
    i<start;
    i++
  ){

    cells += `
      <div class="day"></div>
    `;

  }


  const today =
    todayISO();


  for(
    let day=1;
    day<=days;
    day++
  ){

    const date =
      `${year}-${String(
        month+1
      ).padStart(2,"0")}-${String(
        day
      ).padStart(2,"0")}`;


    const events =
      state.offers.filter(
        offer=>
          offer.followDate===date
      );


    const isToday =
      today===date;


    cells += `

      <div
        class="day ${isToday?"today":""}"
      >

        <div class="daynum">
          ${day}
        </div>

        ${
          events
          .map(
            offer=>`

              <div
                class="
                  event
                  ${
                    status(offer)==="Angenommen"
                    ?"accepted"
                    :status(offer)==="Abgelehnt"
                    ?"rejected"
                    :status(offer)==="Abgelaufen"
                    ?"expired"
                    :""
                  }
                "
                onclick="
                  preview('${offer.id}')
                "
              >

                ${esc(offer.no)}
                ·
                ${esc(
                  offer.customer?.company ||
                  "Kunde"
                )}

              </div>

            `
          )
          .join("")
        }

      </div>

    `;

  }


  const upcoming =
    state.offers
    .filter(
      offer=>
        offer.followDate &&
        status(offer)==="Offen"
    )
    .sort(
      (a,b)=>
        a.followDate.localeCompare(
          b.followDate
        )
    )
    .slice(0,10);


  layout(
    "Kalender",
    "Follow-ups und Angebote verfolgen",

    `

    <div class="panel">

      <div class="calendar-head">

        <button
          class="btn"
          onclick="
            monthCursor.setMonth(
              monthCursor.getMonth()-1
            );
            calendar();
          "
        >
          ‹
        </button>


        <h2 style="margin:0">

          ${
            new Intl.DateTimeFormat(
              "de-DE",
              {
                month:"long",
                year:"numeric"
              }
            ).format(
              monthCursor
            )
          }

        </h2>


        <button
          class="btn"
          onclick="
            monthCursor.setMonth(
              monthCursor.getMonth()+1
            );
            calendar();
          "
        >
          ›
        </button>

      </div>


      <div class="calendar">

        ${cells}

      </div>

    </div>


    <div class="panel">

      <h2>
        Anstehende Follow-ups
      </h2>


      ${
        upcoming
        .map(
          offer=>`

            <div
              style="
                display:flex;
                justify-content:space-between;
                gap:10px;
                padding:11px 0;
                border-bottom:1px solid var(--line)
              "
            >

              <span>

                <b>
                  ${esc(
                    offer.followDate
                  )}
                </b>

                ·

                ${esc(
                  offer.customer?.company ||
                  "Kunde"
                )}

                ${
                  offer.followDate < today
                  ?
                  `
                  <span class="overdue">
                    · überfällig
                  </span>
                  `
                  :
                  ""
                }

              </span>

              ${badge(
                status(offer)
              )}

            </div>

          `
        )
        .join("")

        ||

        `
        <div class="muted">
          Keine offenen Follow-ups geplant.
        </div>
        `
      }

    </div>

    `
  );

}


/* =========================================================
   ANALYTICS
   ========================================================= */

function analytics(){

  const offers =
    state.offers;


  const total =
    offers.length;


  const accepted =
    offers.filter(
      offer=>
        status(offer)==="Angenommen"
    );


  const open =
    offers.filter(
      offer=>
        status(offer)==="Offen"
    );


  const rejected =
    offers.filter(
      offer=>
        status(offer)==="Abgelehnt"
    );


  const volume =
    offers.reduce(
      (sum,offer)=>
        sum + totals(offer).gross,
      0
    );


  const won =
    accepted.reduce(
      (sum,offer)=>
        sum + totals(offer).gross,
      0
    );


  const openVolume =
    open.reduce(
      (sum,offer)=>
        sum + totals(offer).gross,
      0
    );


  const grossProfit =
    accepted.reduce(
      (sum,offer)=>
        sum + profit(offer),
      0
    );


  const average =
    total
    ? volume / total
    : 0;


  const closeRate =
    total
    ? Math.round(
        accepted.length /
        total *
        100
      )
    : 0;


  const now =
    new Date();


  const labels=[];

  const values=[];


  for(
    let i=5;
    i>=0;
    i--
  ){

    const date =
      new Date(
        now.getFullYear(),
        now.getMonth()-i,
        1
      );


    const key =
      `${date.getFullYear()}-${String(
        date.getMonth()+1
      ).padStart(2,"0")}`;


    labels.push(
      new Intl.DateTimeFormat(
        "de-DE",
        {
          month:"short"
        }
      ).format(
        date
      )
    );


    values.push(

      offers

      .filter(
        offer=>
          (
            offer.date ||
            ""
          ).startsWith(
            key
          )
      )

      .reduce(
        (sum,offer)=>
          sum +
          totals(offer).gross,
        0
      )

    );

  }


  const max =
    Math.max(
      ...values,
      1
    );


  layout(
    "Analyse",

    `

        </div>

      </div>


      <div class="card">

        <div class="label">
          Bruttogewinn gewonnen
        </div>

        <div class="value">
          ${money(grossProfit)}
        </div>

      </div>


      <div class="card">

        <div class="label">
          Offene Pipeline
        </div>

        <div class="value">
          ${money(openVolume)}
        </div>

      </div>

    </div>


    <div class="grid2">


      <div class="panel">

        <h2>
          Angebotsvolumen · letzte 6 Monate
        </h2>


        <div class="chart">

          ${
            values
            .map(
              (value,index)=>`

                <div class="chartcol">

                  <b>
                    ${
                      value
                      ? money(value)
                      : ""
                    }
                  </b>

                  <i
                    style="

                        3,
                        value/max*160

                    "

                  <span>
                    ${labels[index]}
                  </span>

                </div>

              `

            .join("")
          }

        </div>

      </div>


      <div class="panel">

        <div class="kpi">

      if(!map[key]){

        map[key]={

          customer:
            offer.customer || {},

          count:0,

          value:0,

          won:0

        };

      }


      map[key].count++;

      map[key].value +=
        totals(offer).gross;


      if(
        status(offer)==="Angenommen"
      ){

        map[key].won +=
          totals(offer).gross;

      }

    }
  );


  layout(
    "Kunden",
    "Kunden aus deinen Angeboten",

    `

    <div class="customer-grid">

      ${
        Object.values(map)
        .map(
          customer=>`

            <div class="customer-card">

              <h3>
                ${esc(
                  customer.customer.company ||
                  "Unbekannt"
                )}
              </h3>


              <p>

                  customer.customer.email ||
                  ""
                )}
              </p>


              <p>

                  customer.customer.phone ||
                  ""
                )}
              </p>


              <p>

                <b>
                  ${customer.count}
                </b>

                Angebote

                ·

                <b>
                  ${money(
                    customer.value
                  )}
                </b>

              </p>


              <p>

                Gewonnen:

                <b>
                  ${money(
                    customer.won
                  )}
                </b>

              </p>

            </div>

          `
        )
        .join("")

        ||

        `
        <div class="panel">
          Noch keine Kunden vorhanden.
        </div>
        `
      }

    </div>

    `
  );

}

function catalog(){

  const rows =
    state.catalog.filter(

        [
          item.articleNo,
          item.name,
          item.unit
        ]
        .join(" ")

          query

  layout(

          class="btn dark"

        >

        </button>

          placeholder="Artikel suchen…"
          value="${esc(
            catalogSearch
          )}"
          oninput="

            renderCatalogTable();
          "
        >

      </div>


      <div id="catalogTable">

        ${catalogRows(rows)}

}


function catalogRows(rows){

  if(!rows.length){

    return `
      <div class="empty">
        Keine Artikel gefunden.
      </div>
    `;

  }


  return `

    <div class="table-wrap">

      <table class="table">

        <thead>

          <tr>

            <th>
              Art.-Nr.
            </th>

            <th>
              Leistung
            </th>

            <th>
              Einheit
            </th>

            <th>
              Verkauf netto
            </th>

            <th>
              Einkauf
            </th>

            <th>
              Marge
            </th>

            <th></th>

          </tr>

        </thead>


        <tbody>

          ${
            rows
            .map(
              item=>{

                const margin =
                  Number(item.price) -
                  Number(item.cost);


                const percent =
                  item.price
                  ? margin /
                    item.price *
                    100
                  : 0;


                return `

                  <tr>

                    <td>
                      ${esc(
                        item.articleNo
                      )}
                    </td>


                    <td>
                      <b>
                        ${esc(
                          item.name
                        )}
                      </b>
                    </td>


                    <td>
                      ${esc(
                        item.unit
                      )}
                    </td>


                    <td>
                      ${money(
                        item.price
                      )}
                    </td>


                    <td>
                      ${money(
                        item.cost
                      )}
                    </td>


                    <td>

                      <b>
                        ${money(
                          margin
                        )}
                      </b>

                      (
                      ${percent.toFixed(0)}%
                      )

                    </td>


                    <td>

                      <button
                        class="btn small"
                        onclick="
                          editCatalogItem(
                            '${item.id}'
                          )
                        "
                      >
                        Bearbeiten
                      </button>


                      <button
                        class="
                          btn
                          small
                          danger
                        "
                        onclick="
                          deleteCatalogItem(
                            '${item.id}'
                          )
                        "
                      >
                        Löschen
                      </button>

                    </td>

                  </tr>

                `;

              }
            )
            .join("")
          }

        </tbody>

      </table>

    </div>

  `;

}


function renderCatalogTable(){

  const table =
    document.getElementById(
      "catalogTable"
    );

  if(!table)return;


  const query =
    catalogSearch
    .toLowerCase()
    .trim();


  const rows =
    state.catalog.filter(
      item=>
        [
          item.articleNo,
          item.name,
          item.unit
        ]
        .join(" ")
        .toLowerCase()
        .includes(
          query
        )
    );


  table.innerHTML =
    catalogRows(rows);

}

function addCatalogItem(){

    "Artikel hinzufügen",

    catalogForm(),

    ()=>{

        document
        .getElementById(
          "catName"
        )
        .value
        .trim();


      if(!name){

        toast(
          "Bitte Artikelname eingeben"
        );

        return;

      }


      state.catalog.push({

        id:
          crypto.randomUUID
          ? crypto.randomUUID()
          : String(Date.now()),

          .getElementById(
            "catNo"
          )

          .trim(),

        name,

/* =========================================================
   EDIT CATALOG ITEM
   ========================================================= */

function editCatalogItem(id){

  const item =
    state.catalog.find(
      x=>x.id===id
    );

  if(!item)return;


  showModal(

    "Artikel bearbeiten",

    catalogForm(item),

    ()=>{

      const name =
        document
        .getElementById(
          "catName"
        )
        .value
        .trim();


      if(!name){

        toast(
          "Bitte Artikelname eingeben"
        );

        return;

      }


      item.articleNo =
        document
        .getElementById(
          "catNo"
        )
        .value
        .trim();


      item.name =
        name;


      item.unit =
        document
        .getElementById(
          "catUnit"
        )
        .value
        .trim() ||
        "Stk.";


      item.price =
        Number(
          document
          .getElementById(
            "catPrice"
          )
          .value
        ) || 0;


      item.cost =
        Number(
          document
          .getElementById(
            "catCost"
          )
          .value
        ) || 0;


      save();

      closeModal();

      toast(
        "Artikel gespeichert"
      );

      catalog();

    }

  );

}


/* =========================================================
   DELETE CATALOG ITEM
   ========================================================= */

function deleteCatalogItem(id){

  const item =
    state.catalog.find(
      x=>x.id===id
    );

  if(!item)return;


  if(
    !confirm(
      `Artikel „${item.name}" löschen?`
    )
  ){

    return;

  }


  state.catalog =
    state.catalog.filter(
      x=>x.id!==id
    );


  save();

  toast(
    "Artikel gelöscht"
  );

  catalog();

}

){

  if(

  ){

    draft.items[index].name =
      "Eigene Position";

    draft.items[index].unit =
      "Stk.";

    draft.items[index].cost =
      0;

    render();

    return;

  }


  const item =
    state.catalog.find(
      x=>x.id===id
    );


  if(item){

    draft.items[index]={

      ...draft.items[index],

      name:item.name,

      articleNo:item.articleNo,

      unit:item.unit,

      price:Number(
        item.price
      ),

      cost:Number(
        item.cost
      )

    };

  }


  render();

}

/* =========================================================
   LOCAL AI / PARSER
   ========================================================= */

function analyze(){

  draft.request =
    document
    .getElementById(
      "request"
    )
    .value;


  const text =
    draft.request
    .toLowerCase();


  draft.items=[];


  const aliases={

    "wärmepumpe":[
      "wärmepumpe",
      "wp",
      "luftwärmepumpe"
    ],

    "gas-brennwerttherme":[
      "gastherme",
      "brennwerttherme",
      "gasheizung"
    ],

    "heizkörper":[
      "heizkörper",
      "radiator"
    ],

    "waschtisch":[
      "waschtisch",
      "waschbecken"
    ],

    "toilette":[
      "toilette",
      "wc",
      "klo"
    ],

    "montage / arbeitszeit":[
      "montage",
      "arbeitszeit",
      "einbau"
    ],

    "demontage":[
      "demontage",
      "ausbau"
    ],

    "anfahrt":[
      "anfahrt",
      "anfahrtskosten"
    ]

  };


  state.catalog.forEach(
    item=>{

      const name =
        item.name
        .toLowerCase();


      const list =
        aliases[name] ||
        [];


      const found =
        text.includes(name) ||
        list.some(
          alias=>
            text.includes(
              alias
            )
        );


      if(!found)return;


      let qty=1;


      const numberMatch =
        text.match(
          /(\d+)\s*(?:x|stück|stk)/i
        );


      if(numberMatch){

        qty =
          Number(
            numberMatch[1]
          ) || 1;

      }


      draft.items.push({

        name:item.name,

        articleNo:
          item.articleNo,

        unit:item.unit,

        qty,

        price:
          Number(item.price),

        cost:
          Number(item.cost)

      });

    }
  );


  toast(

    draft.items.length

    ?

    `${draft.items.length} Position(en) erkannt`

    :

    "Keine Position erkannt"

  );


  render();

}

        </button>

      </div>


      ${previewHtml(fake)}

    </div>

  `;

}


/* =========================================================
   PREVIEW EXISTING OFFER
   ========================================================= */

function preview(id){

  const offer =
    state.offers.find(
      x=>x.id===id
    );

  if(!offer)return;


  page="preview";


  document
    .getElementById("main")
    .innerHTML=`

      <div class="top no-print">

        <div>

          <h1>
            Angebot ${esc(
              offer.no
            )}
          </h1>

          <div class="sub">
            ${badge(
              status(offer)
            )}
          </div>

        </div>


        <div class="toolbar">

          <button
            class="btn"
            onclick="go('offers')"
          >
            ← Zurück
          </button>


          <button
            class="btn"
            onclick="
              editOffer(
                '${offer.id}'
              )
            "
          >
            Bearbeiten
          </button>


          <button
            class="btn"
            onclick="
              duplicateOffer(
                '${offer.id}'
              )
            "
          >
            Duplizieren
          </button>


          <button
            class="btn danger"
            onclick="
              deleteOffer(
                '${offer.id}'
              )
            "
          >
            Löschen
          </button>


          <button
            class="btn dark"
            onclick="window.print()"
          >
            Drucken / PDF
          </button>

        </div>

      </div>


      <div class="panel">

        ${previewHtml(
          offer
        )}

      </div>

    `;


  nav();

}

/* =========================================================
   SAVE OFFER
   ========================================================= */

function saveOffer(){

  const offer={

    id:
      crypto.randomUUID
      ? crypto.randomUUID()
      : String(Date.now()),


    no:
      `EO-${state.nextNo++}`,


    date:
      todayISO(),


    followDate:
      draft.followDate ||

      new Date(
        Date.now() +
        7 *
        86400000
      )
      .toISOString()
      .slice(0,10),


    customer:
      JSON.parse(
        JSON.stringify(
          draft.customer
        )
      ),


    items:
      draft.items.map(
        item=>({

          ...item,

          qty:
            Number(
              item.qty
            ) || 0,

          price:
            Number(
              item.price
            ) || 0,

          cost:
            Number(
              item.cost
            ) || 0

        })
      ),


    notes:
      draft.notes,


    request:
      draft.request,


    status:
      "Offen"

  };


  state.offers.push(
    offer
  );


  save();

  toast(
    "Angebot gespeichert"
  );


  preview(
    offer.id
  );

}


/* =========================================================
   MODAL
   ========================================================= */

function showModal(
  title,
  body,
  onSave
){

  document
    .getElementById(
      "modalRoot"
    )
    .innerHTML=`

      <div
        class="modal-backdrop"
        onclick="
          if(event.target===this)
            closeModal()
        "
      >

        <div class="modal">


          <div class="modal-head">

            <h2>
              ${title}
            </h2>


            <button
              class="btn small"
              onclick="closeModal()"
            >
              ×
            </button>

          </div>


          ${body}


          <div class="modal-actions">

            <button
              class="btn"
              onclick="closeModal()"
            >
              Abbrechen
            </button>


            <button
              class="btn dark"
              id="modalSave"
            >
              Speichern
            </button>

          </div>


        </div>

      </div>

    `;


  document
    .getElementById(
      "modalSave"
    )
    .onclick=onSave;

}


function closeModal(){

  document
    .getElementById(
      "modalRoot"
    )
    .innerHTML="";

}


/* =========================================================
   NAVIGATION FUNCTIONS
   ========================================================= */

function go(target){

  page=target;

  render();

}


/* =========================================================
   RENDER
   ========================================================= */

function render(){

  if(
    page==="dashboard"
  ){

    dashboard();

  }

  else if(
    page==="offers"
  ){

    offers();

  }

  else if(
    page==="calendar"
  ){

    calendar();

  }

  else if(
    page==="analytics"
  ){

    analytics();

  }

  else if(
    page==="customers"
  ){

    customers();

  }

  else if(
    page==="catalog"
  ){

    catalog();

  }

  else if(
    page==="settings"
  ){

    settings();

  }

  else if(
    page==="create"
  ){

    create();

  }

  else if(
    page==="preview"
  ){

    go("offers");

  }

}


/* =========================================================
   GLOBAL PAGE NAVIGATION
   ========================================================= */

document.addEventListener(
  "click",
  event=>{

    const button =
      event.target.closest(
        "[data-page]"
      );


    if(button){

      page =
        button.dataset.page;

      render();

    }

  }
);


/* =========================================================
   FIRST SAVE
   ========================================================= */

save();


/* =========================================================
   START APP
   ========================================================= */

render();

</script>
