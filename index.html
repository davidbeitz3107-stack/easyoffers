<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<title>EasyOffer v2.1</title>

<style>
:root{
  --bg:#f4f4f5;
  --panel:#fff;
  --text:#111;
  --muted:#737373;
  --line:#e4e4e7;
  --dark:#111;
  --soft:#f8f8f8;
  --green:#16803c;
  --orange:#a15c00;
  --red:#b42318;
  --shadow:0 8px 30px rgba(0,0,0,.06);
}

*{box-sizing:border-box}

html,body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

button,input,textarea,select{font:inherit}
button{cursor:pointer}

.sidebar{
  width:240px;
  background:#111;
  color:#fff;
  padding:22px 14px;
  position:fixed;
  inset:0 auto 0 0;
  z-index:10;
}

.brand{
  font-size:23px;
  font-weight:800;
  padding:5px 10px 28px;
}

.brand span{color:#999}

.nav button{
  width:100%;
  background:none;
  border:0;
  color:#aaa;
  text-align:left;
  padding:12px;
  border-radius:9px;
  margin:2px 0;
}

.nav button:hover,
.nav button.active{
  background:#292929;
  color:#fff;
}

.main{
  margin-left:240px;
  padding:28px;
  max-width:1600px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  margin-bottom:24px;
}

.top h1{
  margin:0;
  font-size:28px;
}

.sub{
  color:var(--muted);
  margin-top:5px;
}

.btn{
  border:1px solid var(--line);
  background:#fff;
  padding:10px 15px;
  border-radius:9px;
  font-weight:650;
}

.btn.dark{
  background:#111;
  color:#fff;
  border-color:#111;
}

.btn.small{
  padding:7px 10px;
  font-size:13px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.card,
.panel,
.feature{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  box-shadow:var(--shadow);
}

.card{
  padding:19px;
}

.card .label{
  color:var(--muted);
  font-size:13px;
}

.card .value{
  font-size:27px;
  font-weight:800;
  margin-top:8px;
}

.panel{
  padding:20px;
  margin-top:18px;
}

.panel h2{
  font-size:17px;
  margin:0 0 16px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

.formgrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.full{
  grid-column:1/-1;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:700;
  color:#555;
  margin-bottom:6px;
}

.field input,
.field textarea,
.field select{
  width:100%;
  border:1px solid var(--line);
  border-radius:9px;
  padding:10px;
  background:#fff;
  outline:none;
}

.field textarea{
  min-height:120px;
  resize:vertical;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  text-align:left;
  padding:11px 8px;
  border-bottom:1px solid var(--line);
  font-size:14px;
}

.table th{
  color:var(--muted);
  font-size:12px;
}

.badge{
  display:inline-block;
  padding:5px 9px;
  border-radius:20px;
  font-size:12px;
  background:#eee;
}

.badge.green{
  background:#e8f6ed;
  color:var(--green);
}

.badge.orange{
  background:#fff2df;
  color:var(--orange);
}

.badge.red{
  background:#fdecea;
  color:var(--red);
}

.bar{
  height:12px;
  background:#eee;
  border-radius:20px;
  overflow:hidden;
}

.bar i{
  display:block;
  height:100%;
  background:#111;
}

.kpi{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.mini{
  padding:14px;
  border:1px solid var(--line);
  border-radius:10px;
}

.mini b{
  display:block;
  font-size:22px;
  margin-top:5px;
}

.chart{
  height:250px;
  display:flex;
  align-items:flex-end;
  gap:12px;
  padding:15px 5px 25px;
  border-bottom:1px solid var(--line);
}

.chartcol{
  flex:1;
  height:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:center;
  gap:6px;
}

.chartcol i{
  width:70%;
  max-width:50px;
  background:#111;
  border-radius:5px 5px 0 0;
  min-height:3px;
}

.chartcol span{
  font-size:11px;
  color:var(--muted);
}

.calendar-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  border:1px solid var(--line);
  border-radius:12px;
  overflow:hidden;
}

.cal-dayname{
  padding:10px;
  background:#f8f8f8;
  font-size:12px;
  font-weight:700;
  color:#666;
}

.day{
  min-height:115px;
  border-top:1px solid var(--line);
  border-right:1px solid var(--line);
  padding:7px;
}

.day:nth-child(7n){
  border-right:0;
}

.daynum{
  font-size:12px;
  font-weight:700;
}

.today{
  outline:2px solid #111;
  outline-offset:-2px;
}

.event{
  display:block;
  margin-top:5px;
  padding:5px 6px;
  border-radius:6px;
  background:#111;
  color:#fff;
  font-size:11px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.event.accepted{
  background:#e8f6ed;
  color:var(--green);
}

.event.rejected{
  background:#fdecea;
  color:var(--red);
}

.event.expired{
  background:#eee;
  color:#666;
}

.preview{
  max-width:850px;
  margin:auto;
  background:#fff;
  padding:42px;
  box-shadow:var(--shadow);
  border:1px solid var(--line);
}

.preview-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-bottom:2px solid #111;
  padding-bottom:22px;
}

.preview h1{
  font-size:32px;
  margin:0;
}

.preview table{
  width:100%;
  border-collapse:collapse;
  margin-top:30px;
}

.preview th,
.preview td{
  padding:10px 5px;
  border-bottom:1px solid var(--line);
  text-align:left;
}

.sum{
  margin-left:auto;
  width:280px;
  margin-top:25px;
}

.sumline{
  display:flex;
  justify-content:space-between;
  padding:7px 0;
}

.grand{
  border-top:1px solid #111;
  padding-top:12px;
  margin-top:5px;
  font-size:19px;
  font-weight:800;
}

.customer-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
}

.customer-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:18px;
}

.customer-card h3{
  margin:0 0 7px;
}

.customer-card p{
  margin:4px 0;
  color:var(--muted);
  font-size:14px;
}

.itemrow{
  display:grid;
  grid-template-columns:2fr .7fr .9fr 1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:10px;
}

.itemrow input,
.itemrow select{
  width:100%;
  padding:9px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#fff;
}

.ai-box{
  background:#111;
  color:#fff;
  border-radius:14px;
  padding:22px;
}

.ai-box h2{
  margin:0 0 6px;
}

.ai-box p{
  color:#aaa;
}

.ai-box textarea{
  width:100%;
  min-height:145px;
  border:0;
  border-radius:10px;
  padding:14px;
  outline:none;
}

.ai-result{
  border:1px solid #444;
  border-radius:10px;
  padding:14px;
  margin-top:14px;
  background:#222;
}

.steps{
  display:flex;
  gap:7px;
  margin-bottom:18px;
  overflow:auto;
}

.step{
  padding:8px 12px;
  border:1px solid var(--line);
  border-radius:20px;
  color:#777;
  white-space:nowrap;
}

.step.active{
  background:#111;
  color:#fff;
  border-color:#111;
}

.wizard-actions{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:18px;
}

.mobilebar{
  display:none;
}

.toast{
  position:fixed;
  bottom:20px;
  right:20px;
  background:#111;
  color:#fff;
  padding:12px 16px;
  border-radius:9px;
  z-index:30;
}

.hidden{
  display:none!important;
}

@media(max-width:950px){

  .cards{
    grid-template-columns:repeat(2,1fr);
  }

  .grid2{
    grid-template-columns:1fr;
  }

  .customer-grid{
    grid-template-columns:1fr 1fr;
  }

  .kpi{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:650px){

  .sidebar{
    display:none;
  }

  .main{
    margin-left:0;
    padding:16px;
    padding-bottom:90px;
  }

  .top{
    align-items:flex-start;
  }

  .top h1{
    font-size:24px;
  }

  .cards{
    grid-template-columns:1fr 1fr;
  }

  .formgrid{
    grid-template-columns:1fr;
  }

  .full{
    grid-column:auto;
  }

  .customer-grid{
    grid-template-columns:1fr;
  }

  .itemrow{
    grid-template-columns:1fr 1fr 1fr;
  }

  .itemrow .itemname{
    grid-column:1/-1;
  }

  .preview{
    padding:22px;
  }

  .preview-head{
    flex-direction:column;
  }

  .calendar{
    font-size:11px;
  }

  .day{
    min-height:85px;
    padding:4px;
  }

  .event{
    font-size:9px;
    padding:3px;
  }

  .mobilebar{
    display:flex;
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:#111;
    z-index:20;
    justify-content:space-around;
    padding:9px 4px;
  }

  .mobilebar button{
    background:none;
    border:0;
    color:#aaa;
    font-size:10px;
  }

  .mobilebar button.active{
    color:#fff;
  }
}

@media print{

  .sidebar,
  .mobilebar,
  .top,
  .no-print{
    display:none!important;
  }

  .main{
    margin:0;
    padding:0;
  }

  .panel{
    border:0;
    box-shadow:none;
    padding:0;
  }

  .preview{
    box-shadow:none;
    border:0;
    max-width:none;
  }
}
</style>
</head>

<body>

<aside class="sidebar">

  <div class="brand">
    Easy<span>Offer</span>
  </div>

  <div class="nav">
    <button data-page="dashboard" class="active">▦ &nbsp; Dashboard</button>
    <button data-page="offers">▤ &nbsp; Angebote</button>
    <button data-page="calendar">◫ &nbsp; Kalender</button>
    <button data-page="analytics">◒ &nbsp; Analyse</button>
    <button data-page="customers">♙ &nbsp; Kunden</button>
    <button data-page="catalog">▧ &nbsp; Preiskatalog</button>
    <button data-page="settings">⚙ &nbsp; Einstellungen</button>
  </div>

</aside>

<main class="main" id="main"></main>

<div class="mobilebar">
  <button data-page="dashboard" class="active">Home</button>
  <button data-page="offers">Angebote</button>
  <button data-page="calendar">Kalender</button>
  <button data-page="analytics">Analyse</button>
  <button data-page="settings">Mehr</button>
</div>

<div id="toast" class="toast hidden"></div>

<script>
"use strict";

const KEY="easyoffer_v21";

const catalogDefault=[
  {
    id:"1",
    name:"Gas-Brennwerttherme",
    unit:"Stk.",
    price:3200,
    cost:2200
  },
  {
    id:"2",
    name:"Wärmepumpe",
    unit:"Stk.",
    price:8500,
    cost:6100
  },
  {
    id:"3",
    name:"Heizkörper",
    unit:"Stk.",
    price:420,
    cost:260
  },
  {
    id:"4",
    name:"Waschtisch",
    unit:"Stk.",
    price:280,
    cost:150
  },
  {
    id:"5",
    name:"Toilette",
    unit:"Stk.",
    price:390,
    cost:210
  },
  {
    id:"6",
    name:"Montage / Arbeitszeit",
    unit:"Std.",
    price:65,
    cost:32
  },
  {
    id:"7",
    name:"Demontage",
    unit:"Std.",
    price:55,
    cost:28
  },
  {
    id:"8",
    name:"Anfahrt",
    unit:"Pausch.",
    price:45,
    cost:15
  }
];

const defaults={
  settings:{
    company:"Muster SHK GmbH",
    owner:"Max Mustermann",
    address:"Musterstraße 1\n34117 Kassel",
    iban:"DE00 0000 0000 0000 0000 00"
  },
  catalog:catalogDefault,
  offers:[],
  nextNo:1001
};

let state;

try{
  state=JSON.parse(localStorage.getItem(KEY)||"null")||defaults;
}catch(e){
  state=defaults;
}

if(!state.catalog||!state.catalog.length){
  state.catalog=catalogDefault;
}

if(!state.offers){
  state.offers=[];
}

if(!state.settings){
  state.settings=defaults.settings;
}

if(!state.nextNo){
  state.nextNo=1001;
}

let page="dashboard";

let monthCursor=new Date();

let draft={
  step:1,
  customer:{
    company:"",
    email:"",
    phone:"",
    address:""
  },
  request:"",
  items:[],
  notes:"",
  followDate:""
};

function save(){
  localStorage.setItem(KEY,JSON.stringify(state));
}

function money(n){
  return new Intl.NumberFormat("de-DE",{
    style:"currency",
    currency:"EUR"
  }).format(Number(n)||0);
}

function esc(s){
  return String(s??"").replace(/[&<>"']/g,m=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "\"":"&quot;",
    "'":"&#39;"
  }[m]));
}

function toast(message){
  const box=document.getElementById("toast");

  box.textContent=message;
  box.classList.remove("hidden");

  setTimeout(()=>{
    box.classList.add("hidden");
  },2200);
}

function totals(o){

  const net=(o.items||[]).reduce(
    (sum,item)=>sum+(Number(item.qty)||0)*(Number(item.price)||0),
    0
  );

  return{
    net,
    vat:net*.19,
    gross:net*1.19
  };
}

function status(o){
  return o.status||"Offen";
}

function badge(s){

  let cls="";

  if(s==="Angenommen")cls="green";
  if(s==="Abgelehnt")cls="red";
  if(s==="Offen")cls="orange";

  return `<span class="badge ${cls}">${esc(s)}</span>`;
}

function nav(){

  document.querySelectorAll("[data-page]").forEach(button=>{
    button.classList.toggle(
      "active",
      button.dataset.page===page
    );
  });
}

function layout(title,sub,body,action=""){

  main.innerHTML=`
    <div class="top">

      <div>
        <h1>${title}</h1>
        <div class="sub">${sub||""}</div>
      </div>

      ${action}

    </div>

    ${body}
  `;

  nav();
}

function dashboard(){

  const offers=state.offers;

  const open=offers.filter(
    o=>status(o)==="Offen"
  );

  const accepted=offers.filter(
    o=>status(o)==="Angenommen"
  );

  const volume=offers.reduce(
    (sum,o)=>sum+totals(o).gross,
    0
  );

  const won=accepted.reduce(
    (sum,o)=>sum+totals(o).gross,
    0
  );

  const openValue=open.reduce(
    (sum,o)=>sum+totals(o).gross,
    0
  );

  const quote=offers.length
    ?Math.round(accepted.length/offers.length*100)
    :0;

  layout(
    "Dashboard",
    "Dein Überblick über Angebote und Umsatz",

    `
    <div class="cards">

      <div class="card">
        <div class="label">Angebote</div>
        <div class="value">${offers.length}</div>
      </div>

      <div class="card">
        <div class="label">Offen</div>
        <div class="value">${open.length}</div>
      </div>

      <div class="card">
        <div class="label">Angenommen</div>
        <div class="value">${accepted.length}</div>
      </div>

      <div class="card">
        <div class="label">Angebotsvolumen</div>
        <div class="value">${money(volume)}</div>
      </div>

    </div>

    <div class="grid2">

      <div class="panel">

        <h2>Vertriebs-Pipeline</h2>

        <div class="kpi">

          <div class="mini">
            Offen
            <b>${money(openValue)}</b>
          </div>

          <div class="mini">
            Gewonnen
            <b>${money(won)}</b>
          </div>

          <div class="mini">
            Abschlussquote
            <b>${quote}%</b>
          </div>

        </div>

        <div style="margin-top:18px">

          <div class="muted">
            Abschlussquote
          </div>

          <div class="bar">
            <i style="width:${quote}%"></i>
          </div>

        </div>

      </div>

      <div class="panel">

        <h2>Letzte Angebote</h2>

        ${
          offers
          .slice()
          .reverse()
          .slice(0,5)
          .map(o=>`

            <div style="
              display:flex;
              justify-content:space-between;
              gap:10px;
              padding:10px 0;
              border-bottom:1px solid var(--line)
            ">

              <span>
                <b>${esc(o.no)}</b>
                ·
                ${esc(o.customer.company||"Kunde")}
              </span>

              <span>
                ${money(totals(o).gross)}
              </span>

            </div>

          `)
          .join("")
          ||
          `<div class="muted">
            Noch keine Angebote.
          </div>`
        }

      </div>

    </div>

    <div class="panel">

      <h2>Schnellstart</h2>

      <button
        class="btn dark"
        onclick="newOffer()"
      >
        + Neues Angebot
      </button>

      <button
        class="btn"
        onclick="go('calendar')"
      >
        Kalender
      </button>

      <button
        class="btn"
        onclick="go('analytics')"
      >
        Analyse
      </button>

    </div>
    `
  );
}

function offers(){

  const rows=state.offers
    .slice()
    .reverse();

  layout(
    "Angebote",
    "Angebote verwalten und Status verfolgen",

    `
    <div class="panel">

      <div style="
        display:flex;
        gap:8px;
        flex-wrap:wrap;
        margin-bottom:14px
      ">

        <button
          class="btn dark"
          onclick="newOffer()"
        >
          + Neues Angebot
        </button>

        <select
          class="btn"
          onchange="filterOffers(this.value)"
        >
          <option value="Alle">
            Alle Status
          </option>

          <option>
            Offen
          </option>

          <option>
            Angenommen
          </option>

          <option>
            Abgelehnt
          </option>
        </select>

      </div>

      <div id="offerTable">
        ${offerRows(rows)}
      </div>

    </div>
    `
  );
}

function offerRows(rows){

  if(!rows.length){
    return `
      <div class="muted">
        Noch keine Angebote vorhanden.
      </div>
    `;
  }

  return `
    <table class="table">

      <thead>
        <tr>
          <th>Nr.</th>
          <th>Kunde</th>
          <th>Datum</th>
          <th>Follow-up</th>
          <th>Summe</th>
          <th>Status</th>
          <th></th>
        </tr>
      </thead>

      <tbody>

        ${rows.map(o=>`

          <tr>

            <td>
              <b>${esc(o.no)}</b>
            </td>

            <td>
              ${esc(o.customer.company||"-")}
            </td>

            <td>
              ${esc(o.date||"-")}
            </td>

            <td>
              ${esc(o.followDate||"-")}
            </td>

            <td>
              ${money(totals(o).gross)}
            </td>

            <td>
              ${badge(status(o))}
            </td>

            <td>

              <button
                class="btn small"
                onclick="changeStatus('${o.id}')"
              >
                Status
              </button>

              <button
                class="btn small"
                onclick="preview('${o.id}')"
              >
                Öffnen
              </button>

            </td>

          </tr>

        `).join("")}

      </tbody>

    </table>
  `;
}

function filterOffers(value){

  let rows=state.offers
    .slice()
    .reverse();

  if(value!=="Alle"){
    rows=rows.filter(
      o=>status(o)===value
    );
  }

  document.getElementById("offerTable")
    .innerHTML=offerRows(rows);
}

function changeStatus(id){

  const offer=state.offers.find(
    x=>x.id===id
  );

  if(!offer)return;

  const next={
    Offen:"Angenommen",
    Angenommen:"Abgelehnt",
    Abgelehnt:"Offen"
  };

  offer.status=
    next[status(offer)]||"Offen";

  save();

  toast("Status geändert");

  offers();
}

function calendar(){

  const year=monthCursor.getFullYear();
  const month=monthCursor.getMonth();

  const first=new Date(
    year,
    month,
    1
  );

  const days=new Date(
    year,
    month+1,
    0
  ).getDate();

  const start=
    (first.getDay()+6)%7;

  const names=[
    "Mo",
    "Di",
    "Mi",
    "Do",
    "Fr",
    "Sa",
    "So"
  ];

  let cells=names.map(
    name=>`
      <div class="cal-dayname">
        ${name}
      </div>
    `
  ).join("");

  for(let i=0;i<start;i++){
    cells+=`<div class="day"></div>`;
  }

  const today=new Date();

  for(let day=1;day<=days;day++){

    const date=
      `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    const events=
      state.offers.filter(
        o=>o.followDate===date
      );

    const isToday=
      today.getFullYear()===year &&
      today.getMonth()===month &&
      today.getDate()===day;

    cells+=`

      <div class="day ${isToday?"today":""}">

        <div class="daynum">
          ${day}
        </div>

        ${events.map(o=>`

          <div
            class="event ${
              status(o)==="Angenommen"
              ?"accepted"
              :status(o)==="Abgelehnt"
              ?"rejected"
              :""
            }"
            onclick="preview('${o.id}')"
          >
            ${esc(o.no)}
            ·
            ${esc(o.customer.company||"Kunde")}
          </div>

        `).join("")}

      </div>
    `;
  }

  layout(
    "Kalender",
    "Follow-ups und Angebote verfolgen",

    `
    <div class="panel">

      <div class="calendar-head">

        <button
          class="btn"
          onclick="
            monthCursor.setMonth(
              monthCursor.getMonth()-1
            );
            calendar();
          "
        >
          ‹
        </button>

        <h2 style="margin:0">
          ${new Intl.DateTimeFormat(
            "de-DE",
            {
              month:"long",
              year:"numeric"
            }
          ).format(monthCursor)}
        </h2>

        <button
          class="btn"
          onclick="
            monthCursor.setMonth(
              monthCursor.getMonth()+1
            );
            calendar();
          "
        >
          ›
        </button>

      </div>

      <div class="calendar">
        ${cells}
      </div>

    </div>

    <div class="panel">

      <h2>
        Anstehende Follow-ups
      </h2>

      ${
        state.offers
        .filter(o=>
          o.followDate &&
          o.followDate>=
            new Date()
            .toISOString()
            .slice(0,10) &&
          status(o)==="Offen"
        )
        .sort(
          (a,b)=>
            a.followDate.localeCompare(
              b.followDate
            )
        )
        .slice(0,10)
        .map(o=>`

          <div style="
            display:flex;
            justify-content:space-between;
            gap:10px;
            padding:11px 0;
            border-bottom:1px solid var(--line)
          ">

            <span>
              <b>${esc(o.followDate)}</b>
              ·
              ${esc(o.customer.company||"Kunde")}
            </span>

            ${badge(status(o))}

          </div>

        `)
        .join("")
        ||
        `
        <div class="muted">
          Keine offenen Follow-ups geplant.
        </div>
        `
      }

    </div>
    `
  );
}

function analytics(){

  const offers=state.offers;

  const total=offers.length;

  const accepted=offers.filter(
    o=>status(o)==="Angenommen"
  );

  const open=offers.filter(
    o=>status(o)==="Offen"
  );

  const rejected=offers.filter(
    o=>status(o)==="Abgelehnt"
  );

  const volume=offers.reduce(
    (sum,o)=>sum+totals(o).gross,
    0
  );

  const won=accepted.reduce(
    (sum,o)=>sum+totals(o).gross,
    0
  );

  const openVolume=open.reduce(
    (sum,o)=>sum+totals(o).gross,
    0
  );

  const average=
    total
    ?volume/total
    :0;

  const closeRate=
    total
    ?Math.round(
      accepted.length/total*100
    )
    :0;

  const now=new Date();

  const labels=[];
  const values=[];

  for(let i=5;i>=0;i--){

    const date=new Date(
      now.getFullYear(),
      now.getMonth()-i,
      1
    );

    const key=
      `${date.getFullYear()}-${String(
        date.getMonth()+1
      ).padStart(2,"0")}`;

    labels.push(
      new Intl.DateTimeFormat(
        "de-DE",
        {month:"short"}
      ).format(date)
    );

    values.push(
      offers
      .filter(o=>
        (o.date||"").startsWith(key)
      )
      .reduce(
        (sum,o)=>
          sum+totals(o).gross,
        0
      )
    );
  }

  const max=
    Math.max(...values,1);

  layout(
    "Analyse",
    "Kennzahlen deiner Angebots-Pipeline",

    `
    <div class="cards">

      <div class="card">
        <div class="label">
          Abschlussquote
        </div>

          ${closeRate}%
        </div>
      </div>

      <div class="card">
        <div class="label">
          Gewonnener Umsatz
        </div>
        <div class="value">
          ${money(won)}
        </div>
      </div>

      <div class="card">
        <div class="label">
          Ø Angebotswert
        </div>
        <div class="value">
          ${money(average)}
        </div>
      </div>

      <div class="card">
        <div class="label">
          Offene Pipeline
        </div>
        <div class="value">
          ${money(openVolume)}
        </div>
      </div>

    </div>

    <div class="grid2">

      <div class="panel">

        <h2>
          Angebotsvolumen · letzte 6 Monate
        </h2>

        <div class="chart">

          ${values.map(
            (value,index)=>`

              <div class="chartcol">

                <b>
                  ${
                    value
                    ?money(value)
                    :""
                  }
                </b>

                <i
                  style="
                    height:${Math.max(
                      3,
                      value/max*160
                    )}px
                  "
                ></i>

                <span>
                  ${labels[index]}
                </span>

              </div>

            `
          ).join("")}

        </div>

      </div>

      <div class="panel">

        <h2>
          Angebotsstatus
        </h2>

        <div class="kpi">

          <div class="mini">
            Offen
            <b>${open.length}</b>
          </div>

          <div class="mini">
            Gewonnen
            <b>${accepted.length}</b>
          </div>

          <div class="mini">
            Abgelehnt
            <b>${rejected.length}</b>
          </div>

        </div>

        <div style="margin-top:18px">

          <div class="muted">
            Gewonnen
          </div>

          <div class="bar">
            <i style="
              width:${
                total
                ?accepted.length/total*100
                :0
              }%
            "></i>
          </div>

          <div
            class="muted"
            style="margin-top:12px"
          >
            Offen
          </div>

          <div class="bar">
            <i style="
              width:${
                total
                ?open.length/total*100
                :0
              }%
            "></i>
          </div>

        </div>

      </div>

    </div>

    <div class="panel">

      <h2>
        Deine wichtigsten Kennzahlen
      </h2>

      <table class="table">

        <tbody>

          <tr>
            <td>Gesamtzahl Angebote</td>
            <td>
              <b>${total}</b>
            </td>
          </tr>

          <tr>
            <td>Gesamtes Angebotsvolumen</td>

            </td>
          </tr>

          <tr>
            <td>Gewonnener Umsatz</td>

              <b>${money(won)}</b>
            </td>
          </tr>

          <tr>
            <td>Offene Pipeline</td>

function analyze(){

  draft.request=
    document.getElementById("request").value;

  const text=
    draft.request.toLowerCase();

  draft.items=[];

  state.catalog.forEach(item=>{

    const name=
      item.name.toLowerCase();

    let found=false;

    if(text.includes(name)){
      found=true;
    }

    const aliases={
      "wärmepumpe":[
        "wärmepumpe",
        "wp",
        "luftwärmepumpe"
      ],

      "gas-brennwerttherme":[
        "gastherme",
        "brennwerttherme",
        "gasheizung"
      ],

      "heizkörper":[
        "heizkörper",
        "heizung",
        "radiator"
      ],

      "waschtisch":[
        "waschtisch",
        "waschbecken"
      ],

      "toilette":[
        "toilette",
        "wc",
        "klo"
      ],

      "montage / arbeitszeit":[
        "montage",
        "arbeitszeit",
        "einbau"
      ],

      "demontage":[
        "demontage",
        "ausbau"
      ],

      "anfahrt":[
        "anfahrt",
        "fahrt",
        "anfahrtskosten"
      ]
    };

    const list=aliases[item.name.toLowerCase()]||[];

    if(
      list.some(
        alias=>text.includes(alias)
      )
    ){
      found=true;
    }

    if(found){

      let qty=1;

      const numberMatch=text.match(
        /(\d+)\s*(x|stück|stk)/i
      );

      if(numberMatch){
        qty=Number(numberMatch[1]);
      }

      draft.items.push({
        name:item.name,
        unit:item.unit,
        qty,
        price:item.price
      });

    }

  });

  toast(
    draft.items.length
    ?`${draft.items.length} Position(en) erkannt`
    :"Keine Position erkannt"
  );

  render();
}

          <br>

          ${esc(
            offer.customer.address||""
          )}

        </div>

      </div>

      <h2 style="margin-top:30px">
        Leistungen
      </h2>

      <table>

        <thead>

          <tr>

            <th>
              Position
            </th>

            <th>
              Menge
            </th>

            <th>
              Einheit
            </th>

            <th>
              Einzelpreis
            </th>

            <th>
              Gesamt
            </th>

          </tr>

        </thead>

        <tbody>

          ${
            (offer.items||[])
            .map(item=>`

              <tr>

                <td>
                  ${esc(item.name)}
                </td>

                <td>
                  ${item.qty}
                </td>

                <td>
                  ${esc(item.unit||"Stk.")}
                </td>

                <td>
                  ${money(item.price)}
                </td>

                <td>
                  ${money(
                    item.qty*item.price
                  )}
                </td>

              </tr>

            `).join("")
          }

        </tbody>

      </table>

      <div class="sum">

        <div class="sumline">
          <span>Netto</span>
          <b>${money(total.net)}</b>
        </div>

        <div class="sumline">
          <span>MwSt. 19%</span>
          <b>${money(total.vat)}</b>
        </div>

        <div class="sumline grand">
          <span>Gesamt</span>
          <b>${money(total.gross)}</b>
        </div>

      </div>

      ${
        offer.notes
        ?`

          <div style="margin-top:35px">

            <b>
              Hinweise
            </b>

            <p>
              ${esc(
                offer.notes
              ).replace(/\n/g,"<br>")}
            </p>

          </div>

        `
        :""
      }

    </div>

  `;
}

function saveOffer(){

  const offer={

    id:
      crypto.randomUUID
      ?crypto.randomUUID()
      :String(Date.now()),

    no:
      `EO-${state.nextNo++}`,

    date:
      new Date()
      .toISOString()
      .slice(0,10),

    followDate:
      draft.followDate||
      new Date(
        Date.now()+7*86400000
      )
      .toISOString()
      .slice(0,10),

    customer:draft.customer,

    items:draft.items,

    notes:draft.notes,

    request:draft.request,

    status:"Offen"

  };

  state.offers.push(offer);

  save();

  toast("Angebot gespeichert");

  preview(offer.id);
}

function go(target){

  page=target;

  render();
}

function render(){

  if(page==="dashboard"){
    dashboard();
  }

  else if(page==="offers"){
    offers();
  }

  else if(page==="calendar"){
    calendar();
  }

  else if(page==="analytics"){
    analytics();
  }

  else if(page==="customers"){
    customers();
  }

  else if(page==="catalog"){
    catalog();
  }

  else if(page==="settings"){
    settings();
  }

  else if(page==="create"){
    create();
  }

}

document.addEventListener(
  "click",
  event=>{

    const button=
      event.target.closest(
        "[data-page]"
      );

    if(button){

      page=
        button.dataset.page;

      render();

    }

  }
);

render();
</script>

</body>
</html>
